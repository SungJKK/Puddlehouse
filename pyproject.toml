[project]
name = "lakehouse"
version = "0.1.0"
description = "Local data lakehouse using SQLite, DuckDB, and Parquet files"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.4.4",
    "faker>=40.5.1",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "pandas>=3.0.1",
    "pyarrow>=23.0.1",
    "pytest>=9.0.2",
    "python-dotenv>=1.2.1",
    "rich>=14.3.3",
    "typer>=0.15.0",
    "uvicorn[standard]>=0.34.0",
]

[project.scripts]
lh = "cli.main:app"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["cli*"]

[tool.pytest.ini_options]
pythonpath = ["."]
